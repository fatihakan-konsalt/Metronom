workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync web assets into iOS project
        script: npx cap sync ios
      - name: Build unsigned archive
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive
      - name: Package IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"
          cp -R "$CM_BUILD_DIR/build/App.xcarchive/Products/Applications/App.app" "$CM_BUILD_DIR/build/ipa/Payload/"
          cd "$CM_BUILD_DIR/build/ipa" && zip -qry Metronom.ipa Payload
    artifacts:
      - build/ipa/Metronom.ipa
